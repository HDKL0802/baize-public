# 白泽官网部署 —— 把 website/ 目录发布到 GitHub Pages。
#
# 触发：push 到 main 分支（任何改动）+ workflow_dispatch 手动触发。
#   镜像仓 baize-public 也跑一次（不额外发什么，只是保持两仓行为一致）。
#
# 目标（2026-10-17 起用自定义域名）：
#   https://baize.wydhd.fun  → 仓库 HDKL0802/baize-public（公开镜像）
#   （阿里云 DNS CNAME：baize → hdkl0802.github.io；GitHub Pages Settings 里 Custom domain 已填 baize.wydhd.fun）
#
# 注意：GitHub Pages 需要在仓库 Settings → Pages → Source 选 "GitHub Actions" 才会生效。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
