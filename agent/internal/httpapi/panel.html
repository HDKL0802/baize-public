<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白泽智能体 · 控制台</title>
<!--
  白泽智能体 控制台（产品自带 UI）
  ─────────────────────────────────
  视觉照 QwenPaw 自带的那个控制台做（third_party/qwenpaw/console/src/styles/tokens.css）：
    · 暖灰底 #f9f8f4 + 白卡片 + 8px 圆角 + 1px 细边框 #eae8e7
    · 主色 #ff7f16（hover #ff9d4d，文字态 mix 72% 黑）
    · 状态色沿用 antd：成功 #52c41a / 警告 #faad14 / 错误 #ff4d4f
    · 骨架：左 sidebar（分组导航 + 当前项暖色高亮） + 顶栏（动作/状态） + 主内容区
  令牌由后端在响应时替换（handlePanel 会把 __BAIZE_TOKEN__ 换成真令牌），
  所以这个文件里所有接口调用都自带鉴权，不用手填。
-->
<style>
  :root {
    --app-radius: 8px;
    --app-bg: #f9f8f4;
    --app-surface: #ffffff;
    --app-surface-subtle: #faf9f7;
    --app-shell-bg: #f9f8f4;
    --app-fill: rgba(0, 0, 0, .06);
    --app-fill-subtle: rgba(0, 0, 0, .04);
    --app-fill-strong: rgba(0, 0, 0, .09);
    --app-border: #eae8e7;
    --app-border-strong: #d8d4cf;
    --app-border-subtle: #f0eeeb;
    --app-text: rgba(20, 20, 19, .88);
    --app-text-2: rgba(20, 20, 19, .58);
    --app-text-3: rgba(20, 20, 19, .45);
    --app-text-4: rgba(20, 20, 19, .25);
    --app-accent: #ff7f16;
    --app-accent-hover: #ff9d4d;
    --app-accent-text: color-mix(in srgb, var(--app-accent) 72%, black);
    --app-accent-soft: color-mix(in srgb, var(--app-accent) 10%, transparent);
    --app-accent-faint: color-mix(in srgb, var(--app-accent) 4%, transparent);
    --app-nav-selected-bg: rgba(43, 18, 0, .08);
    --app-success: #52c41a; --app-success-text: #389e0d; --app-success-bg: #f6ffed; --app-success-border: #b7eb8f;
    --app-warning: #faad14; --app-warning-text: #d48806; --app-warning-bg: #fffbe6; --app-warning-border: #ffe58f;
    --app-error: #ff4d4f; --app-error-text: #cf1322; --app-error-bg: #fff2f0; --app-error-border: #ffccc7;
    --app-info-text: #1668dc; --app-info-bg: rgba(22, 119, 255, .06); --app-info-border: rgba(22, 119, 255, .16);
    --app-shadow-sm: 0 2px 8px rgba(0, 0, 0, .06);
    --app-shadow-md: 0 4px 16px rgba(0, 0, 0, .08);
    --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --app-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--app-bg); color: var(--app-text);
    font: 14px/1.5714 var(--app-font); -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--app-info-text); text-decoration: none; }
  code, .mono { font-family: var(--app-mono); font-size: 12px; }

  /* ---------- 骨架 ---------- */
  .shell { display: flex; min-height: 100vh; }
  .side {
    width: 208px; flex: none; background: var(--app-shell-bg);
    border-right: 1px solid var(--app-border); padding: 12px 8px 24px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px 14px; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 7px; flex: none;
    background: var(--app-accent); color: #fff; display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
  }
  .brand b { font-size: 15px; font-weight: 600; }
  .brand span { color: var(--app-text-3); font-size: 11px; display: block; }
  .nav-group { margin-top: 10px; }
  .nav-group > i {
    font-style: normal; display: block; padding: 4px 10px; font-size: 11px;
    color: var(--app-text-4); letter-spacing: .04em;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 7px 10px; border: 0; background: transparent; color: var(--app-text-2);
    border-radius: var(--app-radius); cursor: pointer; font-size: 13px;
  }
  .nav-item:hover { background: var(--app-fill-subtle); color: var(--app-text); }
  .nav-item.on { background: var(--app-nav-selected-bg); color: var(--app-text); font-weight: 500; }
  .nav-item .ico { width: 16px; text-align: center; flex: none; opacity: .85; }
  .nav-item .cnt {
    margin-left: auto; font-size: 11px; color: var(--app-text-3);
    background: var(--app-fill-subtle); border-radius: 9px; padding: 0 6px;
  }
  .nav-item.on .cnt { background: var(--app-surface); }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top {
    height: 56px; flex: none; display: flex; align-items: center; gap: 12px;
    padding: 0 20px; background: var(--app-surface);
    border-bottom: 1px solid var(--app-border); position: sticky; top: 0; z-index: 9;
  }
  .top h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .top .sub { color: var(--app-text-3); font-size: 12px; }
  .top .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .body { padding: 20px; max-width: 1280px; width: 100%; }

  /* ---------- 基础控件（antd 观感） ---------- */
  .btn {
    height: 32px; padding: 0 15px; border-radius: var(--app-radius);
    border: 1px solid var(--app-border-strong); background: var(--app-surface);
    color: var(--app-text); cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--app-accent); color: var(--app-accent-text); }
  .btn.primary { background: var(--app-accent); border-color: var(--app-accent); color: #fff; }
  .btn.primary:hover { background: var(--app-accent-hover); border-color: var(--app-accent-hover); color: #fff; }
  .btn.danger { border-color: var(--app-error-border); color: var(--app-error-text); }
  .btn.danger:hover { background: var(--app-error-bg); border-color: var(--app-error); }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  input[type=text], input[type=number], input[type=password], select, textarea {
    height: 32px; padding: 0 11px; border: 1px solid var(--app-border-strong);
    border-radius: var(--app-radius); background: var(--app-surface); outline: none;
  }
  textarea { height: auto; padding: 8px 11px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--app-accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--app-accent) 20%, transparent); }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch i {
    width: 38px; height: 20px; border-radius: 9999px; background: var(--app-fill-strong);
    position: relative; transition: background .15s;
  }
  .switch i::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 9999px; background: #fff; transition: left .15s;
  }
  .switch.on i { background: var(--app-accent); }
  .switch.on i::after { left: 20px; }

  /* ---------- 卡片 / 表格 / 标签 ---------- */
  .card {
    background: var(--app-surface); border: 1px solid var(--app-border);
    border-radius: var(--app-radius); box-shadow: var(--app-shadow-sm); margin-bottom: 16px;
  }
  .card > header {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--app-border-subtle);
  }
  .card > header h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .card > header .ep { margin-left: auto; color: var(--app-text-4); }
  .card > .pad { padding: 16px; }
  .card > .desc { padding: 0 16px 12px; color: var(--app-text-3); font-size: 12px; margin: 0; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--app-bg); text-align: left; font-weight: 500; font-size: 12px;
    color: var(--app-text-2); padding: 9px 16px; border-bottom: 1px solid var(--app-border-subtle);
    white-space: nowrap;
  }
  tbody td { padding: 11px 16px; border-bottom: 1px solid var(--app-border-subtle); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--app-surface-subtle); }
  td.nowrap, th.nowrap { white-space: nowrap; }
  .cell-title { font-weight: 500; }
  .cell-sub { color: var(--app-text-3); font-size: 12px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--app-text-3); font-size: 13px; }

  .tag {
    display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px;
    border-radius: 4px; font-size: 12px; line-height: 1;
    background: var(--app-bg); border: 1px solid var(--app-border); color: var(--app-text-2);
    margin-right: 4px; white-space: nowrap;
  }
  .tag.ok { background: var(--app-success-bg); border-color: var(--app-success-border); color: var(--app-success-text); }
  .tag.warn { background: var(--app-warning-bg); border-color: var(--app-warning-border); color: var(--app-warning-text); }
  .tag.err { background: var(--app-error-bg); border-color: var(--app-error-border); color: var(--app-error-text); }
  .tag.info { background: var(--app-info-bg); border-color: var(--app-info-border); color: var(--app-info-text); }
  .tag.accent { background: var(--app-accent-soft); border-color: var(--app-accent-border, color-mix(in srgb, var(--app-accent) 42%, transparent)); color: var(--app-accent-text); }
  .dot { width: 7px; height: 7px; border-radius: 9999px; background: #94a3b8; display: inline-block; }
  .dot.ok { background: var(--app-success); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--app-text-2); }
  /* 活动追踪：正在跑的时候，顶栏那个点是"呼吸"的，一眼看出它在干活 */
  .dot.live { background: var(--app-accent); animation: livepulse 1.6s ease-out infinite; }
  @keyframes livepulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 127, 22, .45); }
    70% { box-shadow: 0 0 0 6px rgba(255, 127, 22, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 127, 22, 0); }
  }
  .pill.act .act-detail { color: var(--app-text-3); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill.act .act-time { color: var(--app-text-3); }

  /* ---------- 对话 ---------- */
  .chat { display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .msg .av {
    width: 28px; height: 28px; border-radius: 9999px; flex: none; display: grid; place-items: center;
    font-size: 12px; background: var(--app-accent-soft); color: var(--app-accent-text); font-weight: 600;
  }
  .msg.user .av { background: var(--app-fill); color: var(--app-text-2); }
  .msg .bubble {
    background: var(--app-surface-subtle); border: 1px solid var(--app-border-subtle);
    border-radius: var(--app-radius); padding: 10px 13px; white-space: pre-wrap; word-break: break-word;
    max-width: 100%;
  }
  .msg.user .bubble { background: var(--app-accent-faint); border-color: color-mix(in srgb, var(--app-accent) 18%, transparent); }
  .tool {
    border: 1px solid var(--app-border); border-radius: var(--app-radius);
    background: var(--app-surface); margin: 6px 0; overflow: hidden;
  }
  .tool > summary {
    cursor: pointer; padding: 8px 12px; font-size: 12.5px; display: flex; align-items: center; gap: 8px;
    background: var(--app-bg); list-style: none;
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary .arrow { color: var(--app-text-4); transition: transform .15s; }
  .tool[open] > summary .arrow { transform: rotate(90deg); }
  .tool pre { margin: 0; padding: 10px 12px; overflow-x: auto; background: var(--app-surface); }
  .composer { display: flex; flex-direction: column; gap: 8px; }
  .composer textarea { min-height: 74px; }
  /* 派活用的大输入框 */
  .composer.big textarea { min-height: 168px; font-size: 15px; line-height: 1.7; }
  /* 自由对话：消息区可滚，输入框固定在卡片底部 */
  .chatlist { display: flex; flex-direction: column; gap: 12px; max-height: 46vh; overflow-y: auto; padding: 4px 2px; }
  .chatlist .empty { padding: 18px 8px; }
  .thinking { color: var(--app-text-3); font-size: 13px; }
  .thinking i { display: inline-block; animation: blink 1.2s infinite; font-style: normal; }
  @keyframes blink { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }

  /* ---------- 杂项 ---------- */
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  /* 宽表格在窄窗口里横向滚，别把卡片撑破（render() 会自动给 table 套 .tw） */
  .tw { overflow-x: auto; }
  .tw > table { min-width: 560px; }
  /* 顶栏的侧栏开关（窄窗口用） */
  .burger { display: none; }
  .mask-side { display: none; }
  /* 窗口自适应：窄窗口把侧栏收成抽屉，内容全宽铺开（不靠固定宽度） */
  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
    .side {
      position: fixed; z-index: 31; left: 0; top: 0; bottom: 0; width: 232px;
      transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--app-shadow-md);
    }
    .side.open { transform: none; }
    .side-mask.show { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .35); }
    .burger { display: inline-flex; }
    .body { padding: 14px; }
    .top { padding: 0 14px; gap: 8px; }
    .top .sub { display: none; }
    .pill.act .act-detail { display: none; }
    .chatlist { max-height: none; }
  }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--app-text-2); }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stats > div b { display: block; font-size: 22px; font-weight: 600; line-height: 1.3; }
  .stats > div span { color: var(--app-text-3); font-size: 12px; }
  .logbox {
    margin: 0; padding: 12px 16px; max-height: 62vh; overflow: auto;
    font-family: var(--app-mono); font-size: 12px; white-space: pre-wrap; word-break: break-all;
  }
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--app-surface); border: 1px solid var(--app-border);
    box-shadow: var(--app-shadow-md); border-radius: var(--app-radius);
    padding: 9px 16px; font-size: 13px; z-index: 99; display: none;
  }
  .toast.show { display: block; }
  .toast.err { border-color: var(--app-error-border); background: var(--app-error-bg); color: var(--app-error-text); }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: none;
    align-items: center; justify-content: center; z-index: 98;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--app-surface); border-radius: var(--app-radius); width: min(520px, 92vw);
    box-shadow: var(--app-shadow-md); padding: 20px;
  }
  .modal h3 { margin: 0 0 8px; font-size: 15px; }
  .modal p { margin: 0 0 16px; color: var(--app-text-2); font-size: 13px; }
  .modal .acts { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="shell">
  <!-- 侧栏 -->
  <aside class="side">
    <div class="brand">
      <span class="mark">泽</span>
      <div><b>白泽智能体</b><span id="brand-sub">控制台</span></div>
    </div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <header class="top">
      <button class="btn sm burger" id="btn-burger">☰</button>
      <h1 id="pg-title">总览</h1>
      <span class="sub" id="pg-sub"></span>
      <div class="right" id="pg-actions"></div>
    </header>
    <div class="body" id="view"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="side-mask" id="side-mask"></div>
<div class="modal-mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
'use strict';
const TOKEN = "__BAIZE_TOKEN__";

/* ---------------- 基础 ---------------- */
const $ = (id) => document.getElementById(id);
function esc(s) {
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = "toast"; }, 2600);
}
async function api(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ "X-Baize-Token": TOKEN }, opt.headers || {});
  if (opt.body && typeof opt.body !== "string") {
    opt.headers["Content-Type"] = "application/json; charset=utf-8";
    opt.body = JSON.stringify(opt.body);
  }
  const r = await fetch(path, opt);
  const text = await r.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = { error: text }; }
  if (!r.ok) throw new Error((data && (data.error || data.message)) || ("HTTP " + r.status));
  return data;
}
function confirmBox(title, desc, okText, onOk) {
  $("modal").innerHTML =
    '<h3>' + esc(title) + '</h3><p>' + esc(desc) + '</p><div class="acts">' +
    '<button class="btn" id="m-cancel">取消</button>' +
    '<button class="btn primary" id="m-ok">' + esc(okText || "确定") + '</button></div>';
  $("mask").className = "modal-mask show";
  $("m-cancel").onclick = () => { $("mask").className = "modal-mask"; };
  $("m-ok").onclick = async () => {
    $("mask").className = "modal-mask";
    try { await onOk(); } catch (e) { toast("失败：" + e.message, true); }
  };
}
const fmtMs = (v) => { if (!v) return "—"; const d = new Date(v); return d.toLocaleString("zh-CN", { hour12: false }); };
const fmtAgo = (v) => {
  if (!v) return "—";
  const s = Math.round((Date.now() - v) / 1000);
  if (s < 60) return s + " 秒前";
  if (s < 3600) return Math.round(s / 60) + " 分钟前";
  if (s < 86400) return Math.round(s / 3600) + " 小时前";
  return Math.round(s / 86400) + " 天前";
};
const shortId = (s) => (s || "").slice(0, 12);

/* ---------------- 状态 ---------------- */
const S = {
  page: "agent", state: null, agent: null, logs: [], run: null, chat: [], chatBusy: false,
  activity: null,                                // 活动快照（顶栏"现在在干什么" + 对话页卡片）
  memHits: null, memNote: "", memThreshold: 0,   // 记忆检索的最近一次结果与说明
  memNodes: null, memStale: 0,                   // 记忆树节点 + 摘要没跟上的天数
  persona: null, personaEdit: null,              // 人设状态 + 正在编辑的文件
};
const CHAT_KEY = "bz_console_chat_v1";
function loadChat() { try { S.chat = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]") || []; } catch (e) { S.chat = []; } }
function saveChat() { try { localStorage.setItem(CHAT_KEY, JSON.stringify((S.chat || []).slice(-40))); } catch (e) { } }
loadChat();

const PAGES = [
  { group: "主要" },
  { id: "agent", name: "对话", icon: "💬", title: "对话", sub: "一句话派活，Agent 自己决定调哪些工具" },
  { id: "kb", name: "知识库", icon: "📚", title: "知识库", sub: "待办 + 密码本 + 附件的正本，手机端读的就是这里", ep: "/api/kb/state" },
  { id: "runs", name: "运行记录", icon: "🧾", title: "运行记录", sub: "每次派活的步骤、工具链路与 token 用量", ep: "/api/agent/runs" },
  { group: "资源" },
  { id: "devices", name: "设备", icon: "🖥️", title: "设备", sub: "电脑 / 手机 / NAS 注册上来的执行端", ep: "/api/state.devices" },
  { id: "tasks", name: "任务与审批", icon: "📋", title: "任务与审批", sub: "危险动作要人工放行后才真的执行", ep: "/api/tasks" },
  { id: "memory", name: "长期记忆", icon: "🧠", title: "长期记忆", sub: "任务结论自动落盘，动手前先检索", ep: "/api/agent/memory" },
  { id: "skills", name: "技能", icon: "📦", title: "技能", sub: "工作目录里的可复用技能包", ep: "/api/agent/state.skills" },
  { id: "persona", name: "人设", icon: "🎭", title: "人设", sub: "一组 Markdown 文件，按顺序拼进系统提示；改完立即生效", ep: "/api/agent/persona" },

function renderNav() {
  let html = "";
  PAGES.forEach((p) => {
    if (p.group) { html += '<div class="nav-group"><i>' + esc(p.group) + '</i></div>'; return; }
    let cnt = "";
    if (p.id === "tasks" && S.state) {
      const n = (S.state.tasks || []).filter((t) => t.status === "pending_approval").length;
      if (n) cnt = '<span class="cnt">' + n + '</span>';
    }
    if (p.id === "devices" && S.state) {
      const n = (S.state.devices || []).filter((d) => d.online).length;
      cnt = '<span class="cnt">' + n + '</span>';
    }
    if (p.id === "kb" && S.kbStats) {
      const n = (S.kbStats.todos || 0) + (S.kbStats.passwords || 0);
      if (n) cnt = '<span class="cnt">' + n + '</span>';
    }
    html += '<button class="nav-item' + (S.page === p.id ? " on" : "") + '" data-p="' + p.id + '">' +
      '<span class="ico">' + p.icon + '</span>' + esc(p.name) + cnt + '</button>';
  });
  $("nav").innerHTML = html;
  $("nav").querySelectorAll("[data-p]").forEach((b) => {
    b.onclick = () => { location.hash = "#" + b.dataset.p; };
  });
}

/* 知识库：待办 + 密码本 + 附件的正本都在这（手机端读的就是这份） */
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n >= 1 << 20) return (n / (1 << 20)).toFixed(1) + " MB";
  if (n >= 1 << 10) return (n / (1 << 10)).toFixed(1) + " KB";
  return n + " B";
}
async function kbOp(op, args) {
  const r = await api("/api/kb/op", { method: "POST", body: { op: op, args: args || {} } });
  if (r && r.ok === false) throw new Error(r.error || "后端执行失败");
  return r;
}

function pageMemory() {
  const m = (S.agent && S.agent.memory) || {};
  const nodes = S.memNodes || [];
  const em = (S.agent && S.agent.embedding) || {};
  const mc = (S.agent && S.agent.memoryCfg) || {};
  let h = '<div class="card"><header><h2>记忆</h2><span class="ep mono">/api/agent/memory/tree</span>' +
    '<button class="btn sm" id="btn-trebuild" style="margin-left:auto">重建记忆树摘要</button>' +
    '<button class="btn sm danger" id="btn-mcompact">整理重复记忆</button></header><div class="pad">' +
    '<div class="stats"><div><b>' + (m.chunks || 0) + '</b><span>记忆块</span></div>' +
    '<div><b>' + (m.nodes || 0) + '</b><span>记忆节点</span></div>' +
    '<div><b>' + (m.tokens || 0) + '</b><span>约 token</span></div></div>' +
    // 语义检索到底有没有在工作，必须写清楚：不然检索结果不好也说不清为什么
    '<div class="row" style="margin-top:10px">' +
    '<span class="pill"><i class="dot' + (em.usable ? " ok" : "") + '"></i>' +
    (em.usable ? "语义检索已启用" + (em.dim ? "（" + em.dim + " 维）" : "") : "语义检索未启用") + '</span>' +
    (em.model ? '<span class="pill">向量模型 <b>' + esc(em.model) + '</b></span>' : "") +
    '<span class="pill">自动召回 <b>' + (mc.autoRecall === false ? "关" : "开") + '</b>' +
    (mc.recallProfile ? "（" + esc(mc.recallProfile) + "）" : "") + '</span>' +
    (mc.namespace ? '<span class="pill">分区 <b>' + esc(mc.namespace) + '</b></span>' : "") +
    // 摘要没跟上要说出来：不然节点列表里只有空标题，说不清是没记忆还是没摘要
    (S.memStale > 0
      ? '<span class="pill"><i class="dot"></i>有 <b>' + S.memStale + '</b> 天摘要没跟上（后台每小时自动补）</span>'
      : '<span class="pill"><i class="dot ok"></i>记忆树摘要已跟上</span>') +
    '</div>' +
    (em.usable ? "" : '<div class="cell-sub" style="margin-top:8px">' + esc(em.err || em.note || "") +
      "　到「设置」页可以配一条向量化通道（例如硅基流动 / 本地 embedding），配上之后记忆才按语义检索。</div>") +
    '</div></div>';
  h += '<div class="pad" style="border-top:1px solid var(--app-border-subtle)">' +
    '<div class="row"><input type="text" id="mq" placeholder="检索记忆…" style="flex:1">' +
    '<button class="btn" id="btn-mq">检索</button>' +
    '<button class="btn primary" id="btn-mw">写一条</button></div></div>';
  if (S.memHits) {
    // 搜不到时要说清是"被最低相似度挡了"还是"真没有"，不然看着像记忆丢了
    if (!S.memHits.length) {
      h += '<div class="pad"><div class="empty">没搜到' +
        (S.memThreshold ? '（没有够上最低语义相似度 ' + esc(String(S.memThreshold)) + ' 的记忆）' : "") + "</div>" +
        (S.memNote ? '<div class="cell-sub" style="margin-top:6px">' + esc(S.memNote) + "</div>" : "") + "</div>";
    } else {
      h += '<table><thead><tr><th>标题</th><th>内容</th><th class="nowrap">类型</th><th class="nowrap">评分</th><th class="nowrap">为什么</th></tr></thead><tbody>';
      (S.memHits || []).forEach((x) => {
        const c = x.chunk || x;
        h += '<tr><td class="cell-title">' + esc(c.title || "—") + '</td><td class="cell-sub">' + esc((c.content || "").slice(0, 120)) + "</td>" +
          '<td class="nowrap"><span class="tag">' + esc(c.kind || "") + "</span></td>" +
          '<td class="nowrap cell-sub">' + (x.score ? x.score.toFixed(2) : "") + "</td>" +
          '<td class="nowrap cell-sub">' + esc(x.why || "") + "</td></tr>";
      });
      h += "</tbody></table>";
      if (S.memNote) h += '<div class="pad"><div class="cell-sub">' + esc(S.memNote) + "</div></div>";
    }
  } else if (nodes.length) {
    h += '<table><thead><tr><th class="nowrap">层级</th><th class="nowrap">标题</th><th class="nowrap">记忆条数</th><th>摘要</th></tr></thead><tbody>';
    nodes.forEach((n) => {
      h += '<tr><td class="nowrap"><span class="tag">' + (n.level === 2 ? "周" : "天") + '</span></td>' +
        '<td class="cell-title nowrap">' + esc(n.title || n.id) + '</td>' +
        '<td class="nowrap cell-sub">' + (n.chunkCount || 0) + '</td>' +
        '<td class="cell-sub">' + esc((n.summary || "（摘要还没生成）").slice(0, 180)) + "</td></tr>";
    });
    h += "</tbody></table>";
  } else h += '<div class="empty">还没有记忆</div>';
  return h + "</div>";
}

/* ---------------- 活动追踪（始终开启）----------------
   /api/agent/activity 只读后端进程内存，很轻：顶栏「现在在干什么」徽标和对话页的卡片都靠它轮询。
   阶段名与后端 internal/activity 的 stage 常量一一对应。 */
const STAGE_CN = {
  idle: "空闲", running: "开始运行", thinking: "问模型", retrying: "重试中", tool: "调工具",
  tool_done: "工具返回", tool_error: "工具报错", blocked: "被审批拦下", compressing: "压缩上下文",
  checkpoint: "打快照", memory: "记忆落盘", done: "完成", error: "出错",
};
const stageCN = (s) => STAGE_CN[s] || s || "—";
const stageTag = (s) =>
  s === "error" || s === "tool_error" ? " err"
    : s === "blocked" || s === "retrying" ? " warn"
      : s === "done" ? " ok" : s === "running" ? " accent" : "";
const fmtDur = (ms) => {
  const sec = Math.max(0, Math.round(ms / 1000));
  if (sec < 60) return sec + " 秒";
  if (sec < 3600) return Math.floor(sec / 60) + " 分 " + (sec % 60) + " 秒";
  return Math.floor(sec / 3600) + " 小时 " + Math.floor((sec % 3600) / 60) + " 分";
};

/* 顶栏徽标（id=activity-status，全局常驻） */
function actBadgeInner() {
  const a = S.activity;
  if (!a || !a.stage) return '<i class="dot"></i>活动追踪';
  if (!a.active) return '<i class="dot"></i>空闲';
  return '<i class="dot live"></i><b>' + esc(stageCN(a.stage)) + "</b>" +
    (a.detail ? '<span class="act-detail">' + esc(a.detail) + "</span>" : "") +
    (a.sinceMs ? '<span class="act-time">' + esc(fmtDur(Date.now() - a.sinceMs)) + "</span>" : "");
}
function actBadgeTitle() {
  const a = S.activity;
  if (!a || !a.stage) return "智能体活动追踪（始终开启）";
  if (a.active) return "正在跑：" + stageCN(a.stage) + (a.detail ? " · " + a.detail : "") + (a.runId ? " · 运行 " + a.runId : "");
  return a.detail || a.note || "当前空闲";
}

/* 对话页的卡片：现在在干什么 + 累计统计 + 最近轨迹（新的在前） */
function activityCardInner() {
  const a = S.activity || {};
  const st = a.stats || {};
  let h = '<header><h2>活动追踪</h2><span class="ep mono">/api/agent/activity</span>' +
    '<span class="pill" style="margin-left:auto"><i class="dot' + (a.active ? " live" : "") + '"></i>' +
    (a.active ? esc(stageCN(a.stage)) : "空闲") + "</span></header>";
  h += '<div class="pad"><div class="row">' +
    (a.active
      ? '<span class="pill">现在：<b>' + esc(stageCN(a.stage)) + "</b>" + (a.detail ? " · " + esc(a.detail) : "") + "</span>" +
        (a.sinceMs ? '<span class="pill">已跑 ' + esc(fmtDur(Date.now() - a.sinceMs)) + "</span>" : "") +
        (a.runId ? '<span class="pill mono">' + esc(shortId(a.runId)) + "</span>" : "")
      : '<span class="pill"><i class="dot"></i>' + esc(a.note || "当前没有正在跑的活动") + "</span>" +
        (a.detail ? '<span class="pill">' + esc(a.detail) + "</span>" : "") +
        (st.lastRunAtMs ? '<span class="pill">上次运行 ' + esc(fmtAgo(st.lastRunAtMs)) + "</span>" : "")) +
    '</div><div class="stats" style="margin-top:12px">' +
    "<div><b>" + (st.runs || 0) + "</b><span>运行次数</span></div>" +
    "<div><b>" + (st.toolCalls || 0) + "</b><span>工具调用</span></div>" +
    "<div><b>" + (st.blocked || 0) + "</b><span>被审批拦下</span></div>" +
    "<div><b>" + (st.errors || 0) + "</b><span>出错</span></div>" +
    '</div><p class="cell-sub" style="margin:12px 0 0">这份状态只留在后端进程内存里（重启归零），用来回答「它现在在干什么」；历史账本看「运行记录」。</p></div>';
  const steps = a.steps || [];
  if (!steps.length) return h + '<div class="empty">还没有活动轨迹</div>';
  h += '<table><thead><tr><th class="nowrap">时间</th><th class="nowrap">阶段</th><th>细节</th><th class="nowrap">运行</th></tr></thead><tbody>';
  steps.forEach((s) => {
    h += '<tr><td class="nowrap cell-sub">' + esc(fmtAgo(s.at)) + "</td>" +
      '<td class="nowrap"><span class="tag' + stageTag(s.stage) + '">' + esc(stageCN(s.stage)) + "</span></td>" +
      '<td class="cell-sub">' + esc(s.detail || "—") + "</td>" +
      '<td class="nowrap cell-sub mono">' + esc(shortId(s.runId)) + "</td></tr>";
  });
  return h + "</tbody></table>";
}
function activityCard() { return '<div class="card" id="activity-card">' + activityCardInner() + "</div>"; }

// 局部重绘时要自己给表格套横向滚动容器（整页 render() 会统一套一次）
const wrapTables = (html) => html.replace(/<table/g, '<div class="tw"><table').replace(/<\/table>/g, "</table></div>");
function paintActivity() {
  const b = $("activity-status");
  if (b) { b.innerHTML = actBadgeInner(); b.title = actBadgeTitle(); }
  const c = $("activity-card");
  if (c) c.innerHTML = wrapTables(activityCardInner());
}
async function pollActivity() {
  let a = null;
  try { a = await api("/api/agent/activity"); } catch (e) { return; }
  const was = !!(S.activity && S.activity.active);
  S.activity = a;
  paintActivity();
  // 运行状态刚变化（自己派的活、手机端派活、定时任务都算）：整页取一次新鲜的
  if (a && a.active !== was && (S.page === "agent" || S.page === "runs" || S.page === "tasks")) load(true);
}

    const cur = ((S.state && S.state.deviceRemarks) || {})[b.dataset.rm] || "";
    const v = prompt("给这台设备加个备注（留空 = 清除备注）：", cur);
    if (v === null) return;
    api("/api/agent/device-remark", { method: "POST", body: { deviceId: b.dataset.rm, remark: v } })
      .then(() => { toast(v.trim() ? "备注已保存" : "备注已清除"); load(true); })
      .catch((e) => toast("保存失败：" + e.message, true));
  });
  document.querySelectorAll("[data-run]").forEach((b) => b.onclick = async () => {
    S.run = await api("/api/agent/runs/" + b.dataset.run); render();
  });
  document.querySelectorAll("[data-pt]").forEach((b) => b.onclick = () =>
    api("/api/agent/providers", { method: "POST", body: { action: "test", name: b.dataset.pt } })
      .then((r) => toast("探活：" + (r.result ? (r.result.reply || "通了") + "（" + r.result.totalTokens + " token / " + r.result.latencyMs + "ms）" : "通了")))
      .catch((e) => toast("探活失败：" + e.message, true)));
  document.querySelectorAll("[data-pd]").forEach((b) => b.onclick = () =>
    confirmBox("删除通道", "删掉「" + b.dataset.pd + "」后 Agent 就不能用它了。", "删除", async () => {
      await api("/api/agent/providers", { method: "POST", body: { action: "remove", name: b.dataset.pd } });
      toast("已删除"); load(true);
    }));
  /* 人设：编辑 / 启停 / 恢复默认 / 归档 / 新建 / 总开关 */
  document.querySelectorAll("[data-pedit]").forEach((b) => b.onclick = async () => {
    try {
      const r = await api("/api/agent/persona/file?name=" + encodeURIComponent(b.dataset.pedit));
      S.personaEdit = { name: r.name, content: r.content };
      render();
    } catch (e) { toast("读取失败：" + e.message, true); }
  });
  document.querySelectorAll("[data-ptoggle]").forEach((b) => b.onclick = () => {
    const f = ((S.persona && S.persona.files) || []).find((x) => x.name === b.dataset.ptoggle);
    api("/api/agent/persona", { method: "POST", body: { action: f && f.enabled ? "disable" : "enable", name: b.dataset.ptoggle } })
      .then((r) => { S.persona = r; toast(f && f.enabled ? "已停用" : "已启用"); render(); })
      .catch((e) => toast("失败：" + e.message, true));
  });
  document.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () =>
    confirmBox("恢复默认模板", "会把「" + b.dataset.preset + "」的内容覆盖成内置模板，你的修改会丢。", "恢复默认", async () => {
      S.persona = await api("/api/agent/persona", { method: "POST", body: { action: "reset", name: b.dataset.preset } });
      S.personaEdit = null;
      toast("已恢复默认"); render();
    }));
  document.querySelectorAll("[data-parch]").forEach((b) => b.onclick = () =>
    confirmBox("归档人设文件", "「" + b.dataset.parch + "」会移进 .archive（不硬删），并从加载清单里移除。", "归档", async () => {
      S.persona = await api("/api/agent/persona", { method: "POST", body: { action: "archive", name: b.dataset.parch } });
      if (S.personaEdit && S.personaEdit.name === b.dataset.parch) S.personaEdit = null;
      toast("已归档"); render();
    }));
  on("btn-pnew", () => {
    const name = ($("p-newname").value || "").trim();
    if (!name) { toast("先填文件名（如 RULES.md）", true); return; }
    S.personaEdit = { name: name, content: "# " + name + "\n\n" };
    render();
  });
  on("btn-pmaster", () =>
    api("/api/agent/persona", { method: "POST", body: { action: "master", enabled: !(S.persona && S.persona.enabled) } })
      .then((r) => { S.persona = r; toast(r.enabled ? "人设已启用" : "人设已停用"); render(); })
      .catch((e) => toast("失败：" + e.message, true)));
  on("btn-pcancel", () => { S.personaEdit = null; render(); });
  on("btn-psave", async () => {
    if (!S.personaEdit) return;
    const content = $("p-content").value;
    try {
      S.persona = await api("/api/agent/persona", { method: "POST", body: { action: "save", name: S.personaEdit.name, content: content } });
      S.personaEdit = null;
      toast("已保存（立即生效）"); render();
    } catch (e) { toast("保存失败：" + e.message, true); }
  });
  document.querySelectorAll("[data-mre]").forEach((b) => b.onclick = () =>
    api("/api/agent/mcp", { method: "POST", body: { action: "reload", server: b.dataset.mre } })
      .then(() => { toast("已重载"); load(true); }).catch((e) => toast(e.message, true)));
  document.querySelectorAll("[data-mrm]").forEach((b) => b.onclick = () =>
    confirmBox("卸载 MCP 服务", "卸载「" + b.dataset.mrm + "」后它的工具会从 Agent 工具表里消失。", "卸载", async () => {
      await api("/api/agent/mcp", { method: "POST", body: { action: "remove", server: b.dataset.mrm } });
      toast("已卸载"); load(true);
    }));
  document.querySelectorAll("[data-bv]").forEach((b) => b.onclick = () =>
    api("/api/agent/backups/verify", { method: "POST", body: { path: b.dataset.bv } })
      .then((r) => toast(r.ok ? ("校验通过：" + (r.manifest ? r.manifest.entries.length + " 个文件" : "")) : ("校验失败：" + r.error), !r.ok))
      .catch((e) => toast(e.message, true)));
  document.querySelectorAll("[data-bd]").forEach((b) => b.onclick = () =>
    api("/api/agent/backups/restore", { method: "POST", body: { path: b.dataset.bd, dryRun: true } })
      .then((r) => toast(r.error ? ("试运行被拒：" + r.error) : "试运行通过（没有改动任何数据）", !!r.error))
      .catch((e) => toast(e.message, true)));
  document.querySelectorAll("[data-br]").forEach((b) => b.onclick = () =>
    confirmBox("恢复备份", "会用「" + b.dataset.br + "」覆盖当前数据（恢复前会自动打安全点）。后端在跑的时候会被拒绝——那就先用 CLI 停掉后端再恢复。", "恢复", async () => {
      const r = await api("/api/agent/backups/restore", { method: "POST", body: { path: b.dataset.br } });
      toast(r.error ? ("被拒绝：" + r.error) : "恢复完成", !!r.error);
    }));
  document.querySelectorAll("[data-bx]").forEach((b) => b.onclick = () =>
    confirmBox("删除备份", "删掉「" + b.dataset.bx + "」，不可恢复。", "删除", async () => {
      await api("/api/agent/backups/delete", { method: "POST", body: { path: b.dataset.bx } });
      toast("已删除"); load(true);
    }));

  /* ---- 知识库 ---- */
  on("kb-t-add", async () => {
    const title = $("kb-t-title").value.trim();
    if (!title) { toast("先写待办标题", true); return; }
    const due = ($("kb-t-due").value || "").trim();
    try {
      await kbOp("todo.upsert", {
        title: title,
        category: $("kb-t-cat").value.trim(),
        priority: $("kb-t-pri").value || "mid",
        form: due ? "schedule" : "leisure",
        due: due,
      });
      toast("已加进知识库");
      load(true);
    } catch (e) { toast("没加进去：" + e.message, true); }
  });
  on("kb-p-add", async () => {
    const title = $("kb-p-title").value.trim();
    const account = $("kb-p-acc").value.trim();
    if (!title || !account) { toast("平台与账号都得填", true); return; }
    try {
      await kbOp("vault.merge", {
        title: title, account: account,
        password: $("kb-p-pwd").value,
        group: $("kb-p-group").value.trim(),
        source: "console",
      });
      toast("已存进密码本");
      load(true);
    } catch (e) { toast("没存进去：" + e.message, true); }
  });
  document.querySelectorAll("[data-kb-deltodo]").forEach((b) => {
    b.onclick = () => confirmBox("删除待办", "删掉「" + b.dataset.t + "」，不可恢复，手机上也会跟着消失。", "删除", async () => {
      await kbOp("todo.remove", { id: b.dataset.kbDeltodo });
      toast("已删除"); load(true);
    });
  });
  document.querySelectorAll("[data-kb-delpass]").forEach((b) => {
    b.onclick = () => confirmBox("删除密码记录", "删掉「" + b.dataset.t + "」这条记录（含它的历史密码），不可恢复。", "删除", async () => {
      await kbOp("vault.remove", { id: b.dataset.kbDelpass });
      toast("已删除"); load(true);
    });
  });
  document.querySelectorAll("[data-kb-reveal]").forEach((b) => {
    b.onclick = () => {
      S.kbReveal = S.kbReveal || {};
      const id = b.dataset.kbReveal;
      S.kbReveal[id] = !S.kbReveal[id];
      render();
    };
  });
  document.querySelectorAll("[data-kb-dl]").forEach((b) => {
    b.onclick = async () => {
      try {
        const r = await api("/api/kb/files/" + b.dataset.kbDl);
        const bin = atob(r.dataBase64 || "");
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const f = r.file || {};
        const url = URL.createObjectURL(new Blob([arr], { type: f.mime || "application/octet-stream" }));
        const a = document.createElement("a");
        a.href = url; a.download = f.name || "attachment";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast("已下载 " + (f.name || ""));
      } catch (e) { toast("下载失败：" + e.message, true); }
    };
  });
  document.querySelectorAll("[data-kb-delfile]").forEach((b) => {
    b.onclick = () => confirmBox("删除附件", "删掉「" + b.dataset.t + "」，不可恢复（手机上的待办里也会失效）。", "删除", async () => {
      await api("/api/kb/files/" + b.dataset.kbDelfile, { method: "DELETE" });
      toast("已删除"); load(true);
    });
  });
}

async function approval(id, ok) {
  try {
    await api("/api/agent/approvals/" + id + (ok ? "/approve" : "/reject"),
      { method: "POST", body: { by: "console", reason: ok ? "" : "控制台拒绝" } });
    toast(ok ? "已批准" : "已拒绝");
    load(true);
  } catch (e) { toast(e.message, true); }
}
async function dispatch(deviceId, action, args) {
  try {
    await api("/api/tasks", { method: "POST", body: { deviceId, action, args, origin: "console" } });
    toast("已派发 " + action); setTimeout(() => load(true), 700);
  } catch (e) { toast("派发失败：" + e.message, true); }
}
/* 派活（顶部大输入框）：结果同样落进下面的对话线 */
async function runGoal(wait) {
  const el = $("goal");
  const goal = (el ? el.value : "").trim();
  if (!goal) { toast("先写一句要做什么", true); return; }
  if (el) el.value = "";
  await runText(goal, wait);
}

/* 对话区发送（Enter 或点发送） */
async function chatSend() {
  const el = $("chat-in");
  const text = (el ? el.value : "").trim();
  if (!text) return;
  if (el) el.value = "";
  await runText(text, true);
}

/* 统一入口：发一句话给 Agent，跑完把过程与结论追加到对话线里 */
async function runText(text, wait) {
  if (S.chatBusy) { toast("上一次还在跑，等它结束再发", true); return; }
  S.chat.push({ role: "user", text: text, ts: Date.now() });
  saveChat();
  S.chatBusy = true;
  if (S.page === "agent") render();
  try {
    const r = await api("/api/agent/run", { method: "POST", body: { goal: text, wait: !!wait } });
    if (!wait) {
      S.chat.push({
        role: "agent", trace: [], ts: Date.now(),
        text: "已经派下去了（" + (r.runId || "") + "）。跑完会出现在「运行记录」里；中途有危险动作会挂到「待审批」等你放行。",
      });
    } else {
      const res = r.result || {};
      S.chat.push({
        role: "agent", text: res.text || "（没有结论）", trace: res.trace || [], ts: Date.now(),
        meta: (res.steps || 0) + " 步 · " + (res.toolCalls || 0) + " 次工具 · " + (((res.usage || {}).totalTokens) || 0) + " token",
      });
    }
  } catch (e) {
    S.chat.push({ role: "agent", text: "出错了：" + e.message, trace: [], ts: Date.now() });
  }
  S.chatBusy = false;
  saveChat();
  if (S.page === "agent") render(); else load(true);
}

/* 窄窗口下把侧栏收成抽屉 */
function toggleSide() {
  const s = document.querySelector(".side");
  const m = $("side-mask");
  if (!s) return;
  s.classList.toggle("open");
  if (m) {
    m.className = "side-mask" + (s.classList.contains("open") ? " show" : "");
    m.onclick = () => { s.classList.remove("open"); m.className = "side-mask"; };
  }
}

/* ---------------- 数据加载 ---------------- */
async function load(silent) {
  try {
    const [st, ag, cfg] = await Promise.all([
      api("/api/state?tasks=30&records=30&memories=10"),
      api("/api/agent/state").catch(() => null),
      api("/api/agent/config").catch(() => null),
    ]);
    S.state = st; S.agent = ag || S.agent; S.cfg = cfg || S.cfg;
    S.activity = (ag && ag.activity) || S.activity;   // 活动快照：顶栏徽标 + 对话页卡片
    // 知识库计数：给侧栏那个徽标用（很轻，每轮都取）
    S.kbStats = (st && st.kb) || S.kbStats;
    if (S.page === "kb") {
      const [k, fl, ks] = await Promise.all([
        api("/api/kb/state").catch(() => null),
        api("/api/kb/files?limit=200").catch(() => null),
        api("/api/kb/stats").catch(() => null),
      ]);
      S.kb = k || S.kb;
      S.kbFiles = fl || S.kbFiles;
      S.kbStats = ks || S.kbStats;
    }
    if (S.page === "memory" && !S.memNodes) {
      const t = await api("/api/agent/memory/tree?limit=20").catch(() => null);
      S.memNodes = (t && t.nodes) || [];
      S.memStale = (t && t.staleCount) || 0;
    }
    if (S.page === "logs") {
      const lg = await api("/api/logs?limit=300").catch(() => null);
      S.logs = (lg && lg.lines) || [];
    }
    if (S.page === "voice") {
      const v = await api("/api/agent/voice").catch(() => null);
      S.voice = v || S.voice;
    }
    if (S.page === "persona" && !S.personaEdit) {
      const pp = await api("/api/agent/persona").catch(() => null);
      S.persona = pp || S.persona;
    }
    render();
  } catch (e) {
    if (!silent) toast("加载失败：" + e.message, true);
    $("view").innerHTML = '<div class="card"><div class="empty">加载失败：' + esc(e.message) + "</div></div>";
  }
}

window.addEventListener("hashchange", () => {
  S.page = (location.hash || "#agent").slice(1);
  S.run = null; S.memHits = null; S.memNote = ""; S.memThreshold = 0;
  S.memNodes = null; S.memStale = 0;
  load(true);
});
S.page = (location.hash || "#agent").slice(1);
load();

/* 智能体活动追踪：轻量轮询（顶栏"现在在干什么" + 对话页活动卡片都靠它刷新） */
pollActivity();
setInterval(pollActivity, 3000);

/* 运行中/有待审批时轻量轮询，让对话页自己会动 */
setInterval(() => {
  if (!S.agent || !S.agent.running) return;
  if (S.page === "agent" || S.page === "runs" || S.page === "tasks") load(true);
}, 3000);
</script>
