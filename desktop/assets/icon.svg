<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bz-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151A17"/>
      <stop offset="1" stop-color="#08090A"/>
    </linearGradient>
  </defs>

  <!-- 墨玉底 -->
  <rect width="96" height="96" rx="22" fill="url(#bz-tile)"/>
  <rect x="2" y="2" width="92" height="92" rx="20" fill="none" stroke="#3BE0C4" stroke-opacity=".24"/>

  <!-- 白泽：独角瑞兽侧脸线描（24 网格） -->
  <g transform="translate(12 12) scale(3)" fill="none" stroke="#E6E1D6" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- 头廓（左向侧脸：吻部→额→颅顶→后脑→颌→下颌） -->
    <path d="M4.6 13C4.8 11.4 5.8 10.2 7.2 9.7C7.5 8.4 8.3 7.3 9.5 6.9C10.4 6.6 11.4 6.6 12.3 6.9C14.5 7.4 16.2 9.2 16.5 11.5C16.7 13.1 16.1 14.7 15 15.9C13.2 17.4 10.9 17.9 8.9 17.3C7 16.7 5.4 15.2 4.6 13Z"/>
    <!-- 口缝 -->
    <path d="M5.2 14.6C6.6 15.1 8.2 15.2 9.4 14.8"/>
    <!-- 眉 -->
    <path d="M9.2 9C10.1 8.6 11.1 8.8"/>
    <!-- 耳 -->
    <path d="M12.9 7.2C13.4 5.4 14.5 4.5 15.9 4.7C15.8 6.1 15 7.2 13.9 7.9"/>
    <!-- 鬃（两道向后飘） -->
    <path d="M16.4 9.4C17.9 9.7 19 10.7 19.4 12"/>
    <path d="M16.4 11.6C17.9 12.3 18.8 13.6 19 15.1"/>
  </g>

  <!-- 独角与瞳孔 -->
  <g transform="translate(12 12) scale(3)" fill="none" stroke="#3BE0C4" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.6 6.9C10.9 5 11.6 3.2 12.9 2C13 4.2 12.6 5.8 11.8 6.9Z"/>
    <path d="M9.3 10.5C9.9 9.8 10.9 9.8 11.5 10.4C10.9 11 9.9 11 9.3 10.5Z" fill="#3BE0C4" stroke="none"/>
  </g>
</svg>
