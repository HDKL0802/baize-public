<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2432"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a5e8ff"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#1d9fd8"/>
    </linearGradient>
  </defs>

  <!-- 冷色暗色底 + 细描边（和界面同一套设计语言） -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="7" y="7" width="498" height="498" rx="104" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- 主字：泽（白泽） -->
  <text x="256" y="272" text-anchor="middle" dominant-baseline="central"
        font-family="'Microsoft YaHei','Noto Sans SC','Segoe UI',sans-serif"
        font-size="300" font-weight="700" fill="url(#ink)">泽</text>
</svg>
