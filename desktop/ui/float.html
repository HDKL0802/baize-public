<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白泽浮窗</title>
<style>
  :root{
    --bg:#0e1218; --surface:#141a23; --surface-2:#1a222d;
    --border:#222c38; --border-strong:#2c3846;
    --text:#e6ecf4; --muted:#8b98a8; --faint:#5c6878;
    --accent:#38bdf8; --ok:#34d399; --err:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .wrap{display:flex;flex-direction:column;height:100vh}

  /* 顶部标题栏：高 40px，右侧 132px 留给按钮（原生拖动区与 float_windows.go 对齐） */
  .fhead{
    height:40px;flex:0 0 40px;display:flex;align-items:center;gap:8px;
    padding:0 8px 0 12px;background:var(--surface);border-bottom:1px solid var(--border);
    user-select:none;
  }
  .ftitle{flex:1;min-width:0;font-size:12.5px;font-weight:600;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fbtns{flex:0 0 132px;display:flex;justify-content:flex-end;align-items:center;gap:4px}
  .ibtn{
    width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:4px;
    background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;
    transition:background .12s,color .12s;
  }
  .ibtn:hover{background:var(--surface-2);color:var(--text)}
  .ibtn.on{background:rgba(56,189,248,.14);color:var(--accent)}

  .body{flex:1;min-height:0;display:flex;flex-direction:column}

  /* 提取 / 翻译：正文占满，操作固定在底部一条 */
  .pane{padding:12px;overflow:auto;flex:1;min-height:0}
  .result{
    white-space:pre-wrap;word-break:break-word;background:var(--surface);
    border:1px solid var(--border);border-radius:5px;padding:11px 12px;
    font-size:13.5px;line-height:1.75;min-height:100%;
  }
  .result:empty::before{content:attr(data-ph);color:var(--faint)}
  .bar{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    padding:9px 10px;border-top:1px solid var(--border);background:var(--surface);
  }
  .sp{flex:1}
  .hint{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  select{
    background:var(--bg);color:var(--text);border:1px solid var(--border-strong);
    border-radius:4px;padding:3px 6px;font:inherit;font-size:12px;outline:none;
  }

  button.btn{
    border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
    border-radius:4px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;
    white-space:nowrap;transition:background .12s,border-color .12s,opacity .12s;
  }
  button.btn:hover{background:#22303e}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#08131b;font-weight:600}
  button.btn.primary:hover{background:#4cc6fa}

  /* 对话 */
  .msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:88%;border-radius:6px;padding:8px 11px;font-size:13px;line-height:1.6;word-break:break-word}
  .msg.me{align-self:flex-end;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.28)}
  .msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border)}
  .msg.ai .meta{display:block;margin-top:5px;color:var(--faint);font-size:11px}
  .composer{flex:0 0 auto;padding:10px 12px 12px;border-top:1px solid var(--border);background:var(--surface)}
  .composer textarea{
    width:100%;resize:none;height:58px;background:var(--bg);color:var(--text);
    border:1px solid var(--border-strong);border-radius:5px;padding:9px 10px;font:inherit;
    font-size:13px;outline:none;line-height:1.55;
  }
  .composer textarea:focus{border-color:var(--accent)}
  .send{display:flex;justify-content:flex-end;margin-top:8px}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:1px}
  .dot.busy{background:var(--warn);animation:pulse 1s infinite}
  .dot.ok{background:var(--ok)}
  .dot.err{background:var(--err)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="wrap">
  <div class="fhead">
    <div class="ftitle" id="title">白泽</div>
    <div class="fbtns">
      <button class="ibtn" id="pin" title="钉住（锁死位置并置顶）">📌</button>
      <button class="ibtn" id="close" title="关闭">✕</button>
    </div>
  </div>

  <!-- 对话（临时对话 / 问问白泽） -->
  <div class="body" id="vChat" hidden>
    <div class="msgs" id="msgs">
      <div class="msg ai">你好，我是白泽。说一句话就行。<span class="meta"><span class="dot" id="chatDot"></span><span id="chatStat">就绪</span></span></div>
    </div>
    <div class="composer">
      <textarea id="goal" placeholder="说一句要做什么…（Ctrl+Enter 发送）"></textarea>
      <div class="send"><button class="btn primary" id="send">发送</button></div>
    </div>
  </div>

  <!-- 提取文字 / 翻译 -->
  <div class="body" id="vText" hidden>
    <div class="pane"><div class="result" id="result" data-ph="正在处理…"></div></div>
    <div class="bar">
      <span class="hint" id="stat"></span>
      <label class="hint" id="langWrap" hidden>译文
        <select id="lang"><option value="zh">中文</option><option value="en">英文</option></select>
      </label>
      <span class="sp"></span>
      <button class="btn" id="again">重试</button>
      <button class="btn primary" id="copy">复制</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const SESSION_KEY = 'bz_session';
const session = () => { try { return localStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; } };

async function api(path, method, body) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  const s = session();
  if (s) headers['X-Baize-Session'] = s;
  try {
    const r = await fetch('/api/be' + path, {
      method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined,
    });
    const t = await r.text();
    let d = {}; try { d = t ? JSON.parse(t) : {}; } catch (e) { d = { raw: t }; }
    if (!r.ok) return { ok: false, error: (d && d.error) || ('HTTP ' + r.status) };
    return { ok: true, data: d };
  } catch (e) { return { ok: false, error: String(e && e.message || e) }; }
}
const local = async (p, body) => {
  try {
    const r = await fetch('/api/local' + p, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : {});
    return await r.json();
  } catch (e) { return { ok: false, error: String(e) }; }
};

let MODE = 'chat';
let REV = 0;
let pinned = false;

/* ---------- 顶部按钮 ---------- */
function paintPin() { $('pin').classList.toggle('on', pinned); }
$('pin').onclick = async () => {
  const r = await local('/float/pin', { on: !pinned });
  pinned = !!(r && r.pinned); paintPin();
};
$('close').onclick = () => local('/float/close', {});

/* ---------- 读图 + 走多模态 ---------- */
async function imageBase64() {
  const r = await fetch('/api/local/float/image', { cache: 'no-store' });
  if (!r.ok) return '';
  const buf = new Uint8Array(await r.arrayBuffer());
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < buf.length; i += CH) s += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
  return btoa(s);
}

// visionText 把当前图交给多模态模型，返回文字（失败返回 null）
async function visionText(action, lang) {
  const b64 = await imageBase64();
  if (!b64) return null;
  const body = { action: action, imageBase64: b64 };
  if (action === 'translate') body.lang = lang || $('lang').value;
  const r = await api('/api/agent/vision', 'POST', body);
  if (!r.ok) return { error: r.error || '未知错误' };
  const d = r.data || {};
  const inner = d.data || d;
  return { text: inner.text || '', model: inner.model || '', ms: inner.latencyMs || 0 };
}

/* ---------- 提取文字 / 翻译 ---------- */
async function runVision() {
  const res = $('result'), stat = $('stat');
  $('again').disabled = true; $('copy').disabled = true;
  res.dataset.ph = MODE === 'translate' ? '翻译中…（可能几秒）' : '识别中…（可能几秒）';
  res.textContent = ''; stat.textContent = '';
  const v = await visionText(MODE === 'translate' ? 'translate' : 'extract');
  $('again').disabled = false;
  if (v == null) { res.dataset.ph = '没拿到截图'; return; }
  if (v.error) { res.dataset.ph = '失败：' + v.error; return; }
  res.dataset.ph = '（没有识别到内容）';
  res.textContent = v.text;
  $('copy').disabled = !v.text;
  stat.textContent = v.model ? (v.model + ' · ' + v.ms + ' ms') : '';
}
$('again').onclick = () => runVision();
$('lang').onchange = () => runVision();
$('copy').onclick = async () => {
  const t = $('result').textContent || '';
  if (!t) return;
  try { await navigator.clipboard.writeText(t); $('stat').textContent = '已复制'; }
  catch (e) { $('stat').textContent = '复制失败'; }
};

/* ---------- 对话 ---------- */
function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return d;
}
function setDot(cls, text) {
  $('chatDot').className = 'dot' + (cls ? ' ' + cls : '');
  $('chatStat').textContent = text;
}
async function send() {
  const ta = $('goal'), goal = ta.value.trim();
  if (!goal) return;
  addMsg('me', goal);
  ta.value = '';
  setDot('busy', '已派发，跑着…');
  const r = await api('/api/agent/run', 'POST', { goal, wait: false });
  if (!r.ok) { addMsg('ai', '派发失败：' + (r.error || '未知')); setDot('err', '失败'); return; }
  const d = r.data || {};
  if (d.command) {
    addMsg('ai', d.reply || '（命令已执行）');
    setDot('ok', '魔法命令 /' + (d.name || ''));
    return;
  }
  const id = d.runId || d.id || '';
  const m = addMsg('ai', '已派发' + (id ? ' · ' + id : '') + '，跑完我把结果放这儿。');
  setDot('busy', '运行中…');
  pollRun(id, m);
}
async function pollRun(id, node) {
  let n = 0;
  const tick = async () => {
    n++;
    const r = await api('/api/agent/runs?limit=8');
    if (r.ok) {
      const list = (r.data && (r.data.runs || r.data.items)) || (Array.isArray(r.data) ? r.data : []);
      const it = id ? list.find(x => (x.id || x.runId) === id) : list[0];
      if (it) {
        node.textContent = (it.goal || it.title || '') + '\n状态：' + (it.status || '?') +
          ' · ' + (it.steps ?? '?') + ' 步 · ' + (it.totalTokens ?? '?') + ' token';
        if (it.status === 'done') { setDot('ok', '完成'); return; }
        if (it.status === 'failed') { setDot('err', '失败'); return; }
      }
    }
    if (n < 100) setTimeout(tick, 3000); else setDot('', '超时未回');
  };
  setTimeout(tick, 2500);
}
$('send').onclick = send;
$('goal').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});

// askPrefill 「问问白泽」：把截图里的文字读出来填进输入框，用户接着问
async function askPrefill() {
  const ta = $('goal');
  if (!ta) return;
  ta.placeholder = '正在读出截图里的文字…';
  const v = await visionText('extract');
  ta.placeholder = '说一句要做什么…（Ctrl+Enter 发送）';
  if (v && v.text) {
    ta.value = v.text;
    addMsg('ai', '已把截图里的文字带进来了，接着问就行。');
  }
  ta.focus();
}

/* ---------- 启动 ---------- */
(async function boot() {
  const st = await local('/float/state');
  pinned = !!(st && st.pinned); paintPin();

  const m = await local('/float/mode');
  MODE = (m && m.mode) || 'chat';
  // 同步窗口标题：主进程靠它做「同模式已有窗口就叫到前台」的去重
  document.title = (m && m.title) || '白泽浮窗';
  REV = (m && m.rev) | 0;

  if (MODE === 'extract' || MODE === 'translate') {
    $('vText').hidden = false;
    $('title').textContent = MODE === 'translate' ? '白泽 · 翻译' : '白泽 · 提取文字';
    if (MODE === 'translate') $('langWrap').hidden = false;
    if (m && m.hasImage) await runVision();
    else $('result').dataset.ph = '正在等截图…';
  } else {
    $('vChat').hidden = false;
    $('title').textContent = '白泽 · 对话';
    if (m && m.hasImage) await askPrefill(); else $('goal').focus();
  }

  // 主进程推来新图 → rev 变 → 重跑（提取/翻译出结果；对话则把文字填进输入框）
  setInterval(async () => {
    const s = await local('/float/mode');
    if (!s || !s.ok || s.rev === REV) return;
    REV = s.rev | 0;
    if (MODE === 'extract' || MODE === 'translate') await runVision();
    else await askPrefill();
  }, 1500);
})();
</script>
</body>
</html>
