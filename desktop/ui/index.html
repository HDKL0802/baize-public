<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白泽</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img class="mark" src="icon.png" alt="白泽">
      <div class="bt"><b>白泽</b><span>个人智能体</span></div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidefoot">
      <span class="pill" id="connPill" title="NAS 后端连接状态"><i class="dot off" id="connDot"></i><span id="connText">连接中…</span></span>
      <span class="mono" id="serverText" title="后端地址">—</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb"><span class="ci" id="viewIcon"></span><b id="viewTitle">—</b></div>
      <div class="right">
        <span class="pill" id="approvalPill" hidden title="待人工放行的跨端任务"><i class="dot warn"></i><span id="approvalText">0 待审批</span></span>
        <span class="mono" id="clock">--:--</span>
      </div>
    </header>

    <div class="view" id="view"></div>
  </main>

  <div class="toasts" id="toasts"></div>
</div>

<script src="apps.js"></script>
<script src="apps2.js"></script>
<script src="apps3.js"></script>
<script src="apps4.js"></script>
<script src="apps5.js"></script>
<script src="apps6.js"></script>
<script src="apps7.js"></script>
<script src="shell.js"></script>
</body>
</html>
